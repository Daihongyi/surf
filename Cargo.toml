[package]
name = "surf"
version = "0.5.0-A"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.45" ,features = ["serde"]}
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3.32"
indicatif = "0.17.11"
reqwest = { version = "0.11.27", features = ["json", "stream", "rustls-tls"], default-features = false }
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.12+spec-1.1.0"
dirs = "6.0.0"
serde_json = "1.0.150"
uuid = { version = "1.23.4" ,features = ["v4"]}
colored = "3.1.1"
thiserror = "1.0.69"


tui = "0.19.0"
crossterm = "0.29.0"
rand = "0.9.4"
sha2 = "0.11.0"
hex = "0.4.3"
async-trait = "0.1.89"

[features]
default = []
http3 = ["reqwest/http3"]
